name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Laufende Durchläufe desselben Branches abbrechen, wenn neu gepusht wird
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (Syntax + Datenbankschema)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: household
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d household"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: admin
      PGPASSWORD: secret
      PGDATABASE: household
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Syntax aller Quelldateien prüfen
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Datenbankschema anwenden (frischer Start)
        run: psql -v ON_ERROR_STOP=1 -f src/db/schema.sql

      - name: Datenbankschema erneut anwenden (muss wiederholbar sein)
        run: psql -v ON_ERROR_STOP=1 -f src/db/schema.sql

  docker:
    name: Docker-Images bauen
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Backend-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
